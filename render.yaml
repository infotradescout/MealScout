services:
  # Production web: post-merge install+build only. Pre-merge exact-commit proof is
  # Actions-free: docs/MEALSCOUT_ACTIONS_FREE_EXACT_COMMIT_GATE.md (do not use GitHub Actions).
  - type: web
    name: mealscout
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build:platform
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
